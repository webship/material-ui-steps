name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  site:
    # Two sites, each made at the run from its own release and served from its production build:
    #   demo   Material UI's own Vite starter with its free templates and documentation demos (@mui/material 9.6.0);
    #   admin  react-admin's e-commerce demo, a real app on Material UI 7.
    # On each, the whole suite twice and the assertions that must fail. A Material UI app is drawn by JavaScript:
    # there is no lane without it.
    name: material-ui-steps on the ${{ matrix.site }} site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        site: ['demo', 'admin']
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      SITE: ${{ matrix.site }}
      REPORT_NAME: cucumber_report-${{ matrix.site }}
      WEBSHIP_REPORT_NAME: material-ui-steps, the ${{ matrix.site }} site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: bash .github/scripts/build-${{ matrix.site }}.sh

      - name: Serve the site
        run: |
          port=$([ "${SITE}" = admin ] && echo 8504 || echo 8503)
          nohup bash .github/scripts/serve-${SITE}.sh "$port" > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null "http://127.0.0.1:$port/" && break; sleep 2; done
          curl -fs -o /dev/null -w "the ${SITE} site answers %{http_code}\n" "http://127.0.0.1:$port/"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the site as it found it)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        run: npm run test:must-fail

      - name: The server's log
        if: failure()
        run: tail -n 100 serve.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.site }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.site }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
